name: Rust CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'fire-detection-sim/**.rs'
      - 'fire-detection-sim/Cargo.toml'
      - 'fire-detection-sim/**/Cargo.toml'
      - '.github/workflows/ci-rust.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'fire-detection-sim/**.rs'
      - 'fire-detection-sim/Cargo.toml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fire-detection-sim

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check
        if: hashFiles('fire-detection-sim/Cargo.toml') != ''

      - name: Clippy lint
        run: cargo clippy --all-targets -- -D warnings
        if: hashFiles('fire-detection-sim/Cargo.toml') != ''

      - name: Run tests
        run: cargo test --all
        if: hashFiles('fire-detection-sim/Cargo.toml') != ''
