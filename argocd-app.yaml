apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: d7065e-fire-detection
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/applied-ai-ltu/d7065e.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-edge-intel-course
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
