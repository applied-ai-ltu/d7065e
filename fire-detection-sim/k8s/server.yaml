apiVersion: v1
kind: ConfigMap
metadata:
  name: fds-config
  namespace: ai-edge-intel-course
data:
  config.yaml: |
    buildsim:
      host: "buildsim.ai-edge-intel-course.svc.cluster.local"
      port: 9090
    mqtt:
      host: "mosquitto.data-infra.svc.cluster.local"
      port: 1883
      topic_prefix: "building"
    database:
      host: "timescaledb-stable.homelab.svc.cluster.local"
      port: 5432
      user: "postgres"
      password: ""
      database: "d7065e"
    llm:
      base_url: "https://litellm-service.ai-inference.svc.cluster.local:3443"
      model: "qwen2.5-14b"
      fallback_model: "groq/llama-3.1-70b-versatile"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fds-server
  namespace: ai-edge-intel-course
  labels: {app: fds-server, tier: server}
spec:
  replicas: 1
  strategy: {type: Recreate}   # one physics engine at a time
  selector:
    matchLabels: {app: fds-server}
  template:
    metadata:
      labels: {app: fds-server, tier: server}
    spec:
      nodeSelector:
        kubernetes.io/hostname: proart-master-01
      containers:
        - name: server
          image: fds-server:latest
          imagePullPolicy: Never
          ports:
            - {containerPort: 8089, name: control}
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef: {name: fds-vault, key: token}
            - name: PHOENIX_COLLECTOR_ENDPOINT
              value: "http://192.168.68.67:30317"
          volumeMounts:
            - name: config
              mountPath: /app/configs/config.yaml
              subPath: config.yaml
          readinessProbe:
            httpGet: {path: /status, port: 8089}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /status, port: 8089}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "4", memory: 4Gi}
      volumes:
        - name: config
          configMap: {name: fds-config}
---
apiVersion: v1
kind: Service
metadata:
  name: fds-control
  namespace: ai-edge-intel-course
spec:
  type: NodePort
  selector: {app: fds-server}
  ports:
    - {port: 8089, targetPort: 8089, nodePort: 30089, name: control}
