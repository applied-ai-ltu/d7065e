[project]
name = "fire-detection-sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pyyaml",
    "paho-mqtt",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]
ml = [
    "scikit-learn",
    "numpy",
    "pandas",
    "onnxruntime",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
