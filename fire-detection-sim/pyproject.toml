[project]
name = "fire-detection-sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pyyaml",
    "paho-mqtt",
    "asyncpg",
    "hvac",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]
ml = [
    "scikit-learn",
    "numpy",
    "pandas",
    "onnxruntime",
    "skl2onnx",
]
tracing = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",

]
clearml = [
    "clearml",
]
all = [
    "fire-detection-sim[ml,tracing,clearml]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
per-file-ignores = {"src/fds/run_full.py" = ["E402"], "src/fds/agent/prompts.py" = ["E501"]}
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
